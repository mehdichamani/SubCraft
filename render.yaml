services:
  - type: web
    name: subcraft
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: INSTAGRAM_COOKIES
        sync: false
      - key: YOUTUBE_COOKIES
        sync: false
      - key: COOKIES
        sync: false
      - key: DATABASE_URL
        sync: false
